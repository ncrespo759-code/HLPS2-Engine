name: PS2 build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ps2dev/ps2dev:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build utilities
        run: apk add --no-cache make

      - name: Configure PS2 toolchain
        shell: sh
        run: |
          export PATH="$PS2DEV/ee/bin:$PS2DEV/bin:$PS2SDK/bin:$PATH"
          echo "$PS2DEV/ee/bin" >> "$GITHUB_PATH"
          echo "$PS2DEV/bin" >> "$GITHUB_PATH"
          echo "$PS2SDK/bin" >> "$GITHUB_PATH"
          test -n "$PS2SDK"
          command -v mips64r5900el-ps2-elf-gcc
          command -v make
          test -f "$PS2SDK/samples/Makefile.eeglobal"

      - name: Build bootstrap ELF
        run: make -C ps2 clean all

      - name: Verify ELF
        run: test -s ps2/hlps2.elf

      - name: Publish ELF
        uses: actions/upload-artifact@v4
        with:
          name: hlps2-bootstrap-elf
          path: ps2/hlps2.elf
          if-no-files-found: error
