name: PS2 build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ps2dev/ps2dev:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build utilities
        run: apk add --no-cache make python3

      - name: Configure PS2 toolchain
        shell: sh
        run: |
          export PATH="$PS2DEV/ee/bin:$PS2DEV/dvp/bin:$PS2DEV/bin:$PS2SDK/bin:$PATH"
          echo "$PS2DEV/ee/bin" >> "$GITHUB_PATH"
          echo "$PS2DEV/dvp/bin" >> "$GITHUB_PATH"
          echo "$PS2DEV/bin" >> "$GITHUB_PATH"
          echo "$PS2SDK/bin" >> "$GITHUB_PATH"
          test -n "$PS2SDK"
          command -v mips64r5900el-ps2-elf-gcc
          command -v dvp-as
          command -v make
          test -f "$PS2SDK/samples/Makefile.eeglobal"

      - name: Test host-side VTF asset converter
        run: python3 tools/asset_pipeline/vtf_to_hlps2.py --self-test

      - name: Test Source MDL header inspector
        run: python3 tools/asset_pipeline/inspect_idst.py --self-test

      - name: Test Source asset pack inventory
        run: python3 tools/asset_pipeline/scan_source_assets.py --self-test

      - name: Build stable EE cube ELF
        run: make -C ps2 clean all

      - name: Verify stable ELF
        run: test -s ps2/hlps2.elf

      - name: Build isolated VU1 test ELF
        run: make -C ps2 vu1-test

      - name: Verify isolated VU1 ELF
        run: test -s ps2/hlps2-vu1-test.elf

      - name: Build isolated VU1 to GS triangle test ELF
        run: make -C ps2 vu1-triangle-test

      - name: Verify VU1 triangle test ELF
        run: test -s ps2/hlps2-vu1-triangle-test.elf

      - name: Publish PS2 ELFs
        uses: actions/upload-artifact@v4
        with:
          name: hlps2-ps2-elfs
          path: |
            ps2/hlps2.elf
            ps2/hlps2-vu1-test.elf
            ps2/hlps2-vu1-triangle-test.elf
          if-no-files-found: error
