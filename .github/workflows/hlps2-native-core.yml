name: HLPS2 Native Engine Core

on:
  push:
    branches: [ps2-engine-from-zero]
    paths:
      - 'engine/**'
      - '.github/workflows/hlps2-native-core.yml'
  pull_request:
    paths:
      - 'engine/**'
      - '.github/workflows/hlps2-native-core.yml'
  workflow_dispatch:

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential
      - name: Compile and run portable engine tests
        run: make -C engine clean test
